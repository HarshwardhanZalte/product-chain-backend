<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Traceability Operations{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  {% if user.is_authenticated %}
  <nav class="navbar navbar-dark bg-dark"><div class="container-fluid">
    <a class="navbar-brand" href="{% url 'admin_dashboard' %}">Traceability Admin</a>
    <a class="btn btn-outline-light btn-sm" href="{% url 'admin_logout' %}">Logout</a>
  </div></nav>
  <div class="container-fluid"><div class="row">
    <aside class="col-md-2 bg-white min-vh-100 p-3 border-end">
      <nav class="nav nav-pills flex-column">
        <a class="nav-link" href="{% url 'admin_dashboard' %}">Dashboard</a>
        <a class="nav-link" href="{% url 'admin_users' %}">Users</a>
        <a class="nav-link" href="{% url 'admin_organizations' %}">Organizations</a>
        <a class="nav-link" href="{% url 'admin_batches' %}">Herb Batches</a>
        <a class="nav-link" href="{% url 'admin_lab_tests' %}">Laboratory Tests</a>
        <a class="nav-link" href="{% url 'admin_factories' %}">Factories</a>
        <a class="nav-link" href="{% url 'admin_products' %}">Products</a>
        <a class="nav-link" href="{% url 'admin_activity' %}">Activity</a>
      </nav>
    </aside>
    <main class="col-md-10 p-4">{% block content %}{% endblock %}</main>
  </div></div>
  {% else %}{% block login_content %}{% endblock %}{% endif %}
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
