components:
  schemas:
    ChangePasswordRequest:
      type: object
      properties:
        current_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - current_password
      - new_password
    CollectorProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        collector_id:
          type: string
          format: uuid
          readOnly: true
        collector_name:
          type: string
          maxLength: 255
        phone_number:
          type: string
          maxLength: 20
        address:
          type: string
        verification_status:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
        organization:
          type: integer
          readOnly: true
      required:
      - address
      - collector_id
      - collector_name
      - created_at
      - id
      - organization
      - phone_number
      - updated_at
      - user
    CollectorProfileRequest:
      type: object
      properties:
        collector_name:
          type: string
          minLength: 1
          maxLength: 255
        phone_number:
          type: string
          minLength: 1
          maxLength: 20
        address:
          type: string
          minLength: 1
        verification_status:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - address
      - collector_name
      - phone_number
    EmailRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    FactoryProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        factory_id:
          type: string
          format: uuid
          readOnly: true
        factory_name:
          type: string
          maxLength: 255
        registration_number:
          type: string
          maxLength: 100
        address:
          type: string
        contact_number:
          type: string
          maxLength: 20
        verification_status:
          type: string
          maxLength: 20
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        user:
          type: integer
          readOnly: true
        organization:
          type: integer
          readOnly: true
      required:
      - address
      - contact_number
      - created_at
      - factory_id
      - factory_name
      - id
      - organization
      - registration_number
      - updated_at
      - user
    FactoryProfileRequest:
      type: object
      properties:
        factory_name:
          type: string
          minLength: 1
          maxLength: 255
        registration_number:
          type: string
          minLength: 1
          maxLength: 100
        address:
          type: string
          minLength: 1
        contact_number:
          type: string
          minLength: 1
          maxLength: 20
        verification_status:
          type: string
          minLength: 1
          maxLength: 20
      required:
      - address
      - contact_number
      - factory_name
      - registration_number
    FarmerProfile:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        farmer_id:
          type: string
          format: uuid
          readOnly: true
        farmer_name:
          type: string
          maxLength: 255
        phone_number:
          type: string
          maxLength: 20
        address:
          type: string
        village:
          type: string
          maxLength: 100
        district:
          type: string
          maxLength: 100
        state:
          type: string
          maxLength: 100
